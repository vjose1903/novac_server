# Entorno de prueba para Coolify.
# No comparte contenedores, red ni volumen de base de datos con producción.
# Las variables con secretos deben configurarse en Coolify antes de desplegar.
services:
  db-prod:
    image: postgres:18.6
    environment:
      POSTGRES_PASSWORD: ${COOLIFY_TEST_DB_PASSWORD}
      POSTGRES_USER: ${COOLIFY_TEST_DB_USER}
      PGDATA: /var/lib/postgresql/18/docker
    volumes:
      - novac_coolify_vasquez_test_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${COOLIFY_TEST_DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 12

  vasquez-test:
    build:
      context: .
      dockerfile: docker/Dockerfile
    environment:
      ALMACEN: vasquez_services_coolify_test
      RAILS_ENV: production
      TULU: ${COOLIFY_TEST_DB_PASSWORD}
      FRAGA: ${COOLIFY_TEST_DB_USER}
      MONTU: ${MONTU}
      RAILS_SERVE_STATIC_FILES: "true"
      API_BASE_URL_DGII_MICROSERVICE: http://dgii-microservice-test:9093
      DGII_CERTIFICATION_DATE: ""
      USE_DGII_MICROSERVICE: "false"
      PORT: "3002"
      RAILS_MAX_THREADS: "5"
      WEB_CONCURRENCY: "1"
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-service-account.json
    expose:
      - "3002"
    ports:
      - "9302:3002"
    depends_on:
      db-prod:
        condition: service_healthy
    volumes:
      - /home/novac/proyects/novac-server/secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    command: ["sh", "-lc", "bundle exec rails db:create >/dev/null 2>&1 || true; bundle exec rails db:migrate && exec sh ./run_server.sh"]
    restart: unless-stopped

volumes:
  novac_coolify_vasquez_test_db:
