services:
  db-prod:
    image: postgres:13.7
    volumes:
      - ./tmp/$$DB_PATH$$:/var/lib/postgresql/data
    container_name: db-prod
    environment:
      POSTGRES_PASSWORD: N0v@cgu@rd
      POSTGRES_USER: novacSystem
    ports:
      - 127.0.0.1:9731:5432
    restart: always

  $$PROD_ENVIRONMENT_NAME_IMG$$:
    build:
      context: .
      dockerfile: docker/services/server/Dockerfile
    container_name: $$PROD_ENVIRONMENT_NAME_IMG$$
    environment:
      ALMACEN: "$$ALMACEN$$"
      RAILS_ENV: "production"
      TULU: "N0v@cgu@rd"
      FRAGA: "novacSystem"
      MONTU: "$$MONTU$$"
      RAILS_SERVE_STATIC_FILES: "true"
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
    depends_on:
      - db-prod
    restart: always
    command: >
      sh -c "./wait-for-it.sh db-prod:5432 -- cron && sh ./run_server.sh"

  nginx-proxy-prod:
    build: ./docker/services/nginx
    container_name: nginx-proxy-prod
    ports:
      - $$FRONT_PORT$$:$$FRONT_PORT$$
    depends_on:
      - $$PROD_ENVIRONMENT_NAME_IMG$$
    restart: always