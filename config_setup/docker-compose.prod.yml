version: "3.8"

services:
  db-prod:
    image: postgres:13.7
    volumes:
      - ./tmp/$$DB_PATH$$:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
    restart: always

  $$NAME_IMG_PROD$$:
    build: .
    environment:
      DATABASE_NAME: "$$DATABASE_NAME$$"
      RAILS_ENV: "production"
      RAILS_SERVE_STATIC_FILES: "true"
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
    depends_on:
      - db-prod
    ports:
      - "3000:3000"
    restart: always
    command: >
      sh -c "rm tmp/pids/server.pid ||
      cron &&
      rails server -b 0.0.0.0 --port 3000"