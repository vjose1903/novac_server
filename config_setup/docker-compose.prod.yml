version: "3.8"

services:
  db-prod:
    image: postgres:13.7
    volumes:
      - ./tmp/$$DB_PATH$$:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
    restart: always

  $$NAME_IMG_PROD$$:
    build: .
    environment:
      DATABASE_NAME: "$$DATABASE_NAME$$"
      RAILS_ENV: "production"
      RAILS_SERVE_STATIC_FILES: "true"
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
    depends_on:
      - db-prod
    ports:
      - "$$DB_PORT$$:$$DB_PORT$$"
    restart: always
    command: >
      sh -c "./wait-for-it.sh db-prod:5432 -- cron && sh ./run_server.sh"