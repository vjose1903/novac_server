services:
  db-dev:
    image: postgres:13.7
    volumes:
      - ./tmp/$$DB_PATH$$:/var/lib/postgresql/data
    container_name: db-dev
    environment:
      POSTGRES_PASSWORD: N0v@cgu@rd
      POSTGRES_USER: novacSystem
    ports:
      - 127.0.0.1:9731:5432

  $$ENVIRONMENT_NAME_IMG$$:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: $$ENVIRONMENT_NAME_IMG$$
    environment:
      ALMACEN: "$$ALMACEN$$"
      RAILS_ENV: "development"
      TULU: "N0v@cgu@rd"
      FRAGA: "novacSystem"
      MONTU: "$$MONTU$$"
      VIRTUAL_HOST: "localhost,novac.loca.lt"
      API_BASE_URL_DGII_MICROSERVICE: "http://dgii-microservice-dev:$$DGII_MICROSERVICE_PORT$$"
    expose:
      - "$$DB_PORT$$"
    depends_on:
      - db-dev
    volumes:
      - .:/usr/src/novac_server
    command: ["./wait-for-it.sh", "db-dev:5432", "--", "sh", "./run_server.sh"]

  dgii-microservice-dev:
    build:
      context: ./dgii_signature_microservice
      dockerfile: Dockerfile.dev
    container_name: dgii-microservice-dev
    env_file:
      - ./dgii_signature_microservice/.env
    environment:
      ENV: "DEV"
    expose:
      - "9091"
    volumes:
      - ./dgii_signature_microservice/src:/app/src
      - ./dgii_signature_microservice/tsconfig.json:/app/tsconfig.json
      - ./dgii_signature_microservice/package.json:/app/package.json
    restart: unless-stopped
    depends_on:
      - db-dev

  nginx-proxy-dev:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy-dev
    ports:
      - $$FRONT_PORT$$:80
    depends_on:
      - $$ENVIRONMENT_NAME_IMG$$
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

