version: "3.8"

services:
  db-dev:
    image: postgres:13.7
    volumes:
      - ./tmp/$$DB_PATH$$:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password

  $$NAME_IMG_DEV$$:
    build: .
    environment:
      DATABASE_NAME: "$$DATABASE_NAME$$"
      RAILS_ENV: "development"
    depends_on:
      - db-dev
    ports:
      - "$$DB_PORT$$:$$DB_PORT$$"
    volumes:
      - .:/usr/src/novac_server
    command: ["./wait-for-it.sh", "db-dev:5432", "--", "sh", "/run_server.sh"]
