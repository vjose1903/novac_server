services:
  db-dev:
    image: postgres:18.6
    volumes:
      - ./tmp/$$DB_PATH$$-pg18:/var/lib/postgresql
    container_name: db-dev
    environment:
      POSTGRES_PASSWORD: N0v@cgu@rd
      POSTGRES_USER: novacSystem
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - 127.0.0.1:9731:5432

  $$ENVIRONMENT_NAME_IMG$$:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: $$ENVIRONMENT_NAME_IMG$$
    environment:
      ALMACEN: "$$ALMACEN$$"
      RAILS_ENV: "development"
      TULU: "N0v@cgu@rd"
      FRAGA: "novacSystem"
      MONTU: "$$MONTU$$"
      VIRTUAL_HOST: "localhost,novac.loca.lt,10.0.0.252"
      API_BASE_URL_DGII_MICROSERVICE: "http://dgii-microservice-dev:$$DGII_MICROSERVICE_PORT$$"
      DGII_CERTIFICATION_DATE: "$$DGII_DATE$$"
      USE_DGII_MICROSERVICE: "$$USE_DGII_MICROSERVICE$$"
      PORT: "$$DB_PORT$$"
      RAILS_MAX_THREADS: "5"
      WEB_CONCURRENCY: "0"
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase-service-account.json"
    expose:
      - "$$DB_PORT$$"
    depends_on:
      - db-dev
    volumes:
      - .:/usr/src/novac_server
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    command: ["./wait-for-it.sh", "db-dev:5432", "--", "sh", "./run_server.sh"]

  dgii-microservice-dev:
    profiles:
      - "dgii"
    build:
      context: ./dgii_signature_microservice
      dockerfile: Dockerfile.dev
    container_name: dgii-microservice-dev
    env_file:
      - ./dgii_signature_microservice/.env
    environment:
      ENV: "DEV"
      NODE_ENV: "development"
      NODE_OPTIONS: "--trace-deprecation"
    expose:
      - "9091"
    volumes:
      - ./dgii_signature_microservice/src:/app/src
      - ./dgii_signature_microservice/tsconfig.json:/app/tsconfig.json
      - ./dgii_signature_microservice/package.json:/app/package.json
    restart: unless-stopped
    depends_on:
      - db-dev

  nginx-proxy-dev:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy-dev
    ports:
      - $$FRONT_PORT$$:80
    depends_on:
      - $$ENVIRONMENT_NAME_IMG$$
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./logs/nginx:/var/log/nginx
      - ./config/nginx/client-body-size.conf:/etc/nginx/conf.d/client-body-size.conf:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fail2ban/data:/data
      - ./logs/nginx:/var/log/nginx:ro 
      - /etc/localtime:/etc/localtime:ro 
    environment:
      TZ: "America/Santo_Domingo"
    restart: unless-stopped

