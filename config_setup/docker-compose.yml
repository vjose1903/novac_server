services:
  db-dev:
    image: postgres:13.7
    volumes:
      - ./tmp/$$DB_PATH$$:/var/lib/postgresql/data
    container_name: db-dev
    environment:
      POSTGRES_PASSWORD: N0v@cgu@rd
      POSTGRES_USER: novacSystem
    ports:
      - 127.0.0.1:9731:5432

  $$ENVIRONMENT_NAME_IMG$$:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: $$ENVIRONMENT_NAME_IMG$$
    environment:
      ALMACEN: "$$ALMACEN$$"
      RAILS_ENV: "development"
      TULU: "N0v@cgu@rd"
      FRAGA: "novacSystem"
      MONTU: "$$MONTU$$"
      VIRTUAL_HOST: "localhost"
      API_BASE_URL_DGII_MICROSERVICE: "http://host.docker.internal:9091"
    expose:
      - "3000"
    depends_on:
      - db-dev
    volumes:
      - .:/usr/src/novac_server
    command: ["./wait-for-it.sh", "db-dev:5432", "--", "sh", "./run_server.sh"]

  nginx-proxy-dev:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy-dev
    ports:
      - $$FRONT_PORT$$:80
    depends_on:
      - $$ENVIRONMENT_NAME_IMG$$
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

