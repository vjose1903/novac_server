version: "3.8"

services:
  db:
    image: postgres:14
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
    restart: always

  brendy-prod:
    build: .
    environment:
      DATABASE_NAME: "panaderia_brendy"
      RAILS_ENV: "production"
      RAILS_SERVE_STATIC_FILES: true
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
    depends_on:
      - db
    ports:
      - "3000:3000"
    restart: always

volumes:
  db_data: