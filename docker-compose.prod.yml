services:
  db-prod:
    image: postgres:13.7
    volumes:
      - ./tmp/db-agrodemi-data:/var/lib/postgresql/data
    container_name: db-prod
    environment:
      POSTGRES_PASSWORD: N0v@cgu@rd
      POSTGRES_USER: novacSystem
    ports:
      - 127.0.0.1:9731:5432
    restart: always

  agrodemi-prod:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: agrodemi-prod
    environment:
      VIRTUAL_HOST: "localhost,novac.loca.lt"
      # LETSENCRYPT_HOST: "agrodemi.inspot-technology.com,admservidor.ddns.net"
      # LETSENCRYPT_EMAIL: "novacagrodemi@gmail.com"
      ALMACEN: "ADM"
      RAILS_ENV: "production"
      TULU: "N0v@cgu@rd"
      FRAGA: "novacSystem"
      MONTU: "1RzMbNCVAhqkNzH0mTO8f27-kfq1oum6a"
      RAILS_SERVE_STATIC_FILES: "true"
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
      API_BASE_URL_DGII_MICROSERVICE: "http://dgii-microservice-prod:9091"
    expose:
      - "3000"
    depends_on:
      - db-prod
    restart: always
    command: >
      sh -c "./wait-for-it.sh db-prod:5432 -- cron && sh ./run_server.sh"

  dgii-microservice-prod:
    build:
      context: ./dgii_signature_microservice
      dockerfile: Dockerfile
    container_name: dgii-microservice-prod
    env_file:
      - ./dgii_signature_microservice/.env
    environment:
      ENV: "PROD"
    expose:
      - "9091"
    restart: always
    depends_on:
      - db-prod

  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "9090:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./html:/usr/share/nginx/html
    restart: always
    depends_on:
      - db-prod

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    container_name: nginx-letsencrypt
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: novacagrodemi@gmail.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./html:/usr/share/nginx/html
    depends_on:
      - nginx-proxy
    restart: always