version: "3.8"

services:
  db-prod:
    image: postgres:13.7
    volumes:
      - ./tmp/db-demo-data:/var/lib/postgresql/data
    container_name: db-prod
    environment:
      POSTGRES_PASSWORD: N0v@cgu@rd
      POSTGRES_USER: novacSystem
    ports:
      - 127.0.0.1:9731:5432
    restart: always

  demo-prod:
    build:
      context: .
      dockerfile: docker/services/server/Dockerfile
    container_name: demo-prod
    environment:
      ALMACEN: "DEMO"
      RAILS_ENV: "production"
      TULU: "N0v@cgu@rd"
      FRAGA: "novacSystem"
      MONTU: "1Wt7ND-m7yZidbgRyf_89fNeK71gyz7fn"
      RAILS_SERVE_STATIC_FILES: "true"
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
    depends_on:
      - db-prod
    restart: always
    command: >
      sh -c "./wait-for-it.sh db-prod:5432 -- cron && sh ./run_server.sh"

  nginx-proxy-prod:
    build: ./docker/services/nginx
    container_name: nginx-proxy-prod
    ports:
      - 9093:9093
    depends_on:
      - demo-prod
    restart: always