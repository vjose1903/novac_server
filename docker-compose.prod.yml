services:
  db-prod:
    image: postgres:18.6
    volumes:
      - ./tmp/db-brendy-data-pg18:/var/lib/postgresql
    container_name: db-prod
    environment:
      POSTGRES_PASSWORD: N0v@cgu@rd
      POSTGRES_USER: novacSystem
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - 127.0.0.1:9731:5432
    restart: always

  brendy-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: brendy-dev
    environment:
      VIRTUAL_HOST: "novac-brendy.ddns.net,novac-brendy.ddns.net,10.0.0.9"
      LETSENCRYPT_HOST: "novac-brendy.ddns.net,novac-brendy.ddns.net"
      LETSENCRYPT_EMAIL: "novacbrendy@gmail.com"
      ALMACEN: "panaderia_brendy"
      RAILS_ENV: "production"
      TULU: "N0v@cgu@rd"
      FRAGA: "novacSystem"
      MONTU: "1C96yS20EDDyX7rgi2Y5OQju_4FQ8G5_C"
      RAILS_SERVE_STATIC_FILES: "true"
      DISABLE_DATABASE_ENVIRONMENT_CHECK: 1
      API_BASE_URL_DGII_MICROSERVICE: "http://dgii-microservice-prod:9092"
      DGII_CERTIFICATION_DATE: ""
      USE_DGII_MICROSERVICE: "false"
      PORT: "3001"
      RAILS_MAX_THREADS: "5"
      WEB_CONCURRENCY: "2"
      GOOGLE_APPLICATION_CREDENTIALS: "/run/secrets/firebase-service-account.json"
    expose:
      - "3001"
    depends_on:
      - db-prod
    restart: always
    volumes:
      - ./public/img:/usr/src/novac_server/public/img
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    command: >
      sh -c "./wait-for-it.sh db-prod:5432 -- sh ./run_server.sh"

  dgii-microservice-prod:
    profiles:
      - "dgii"
    build:
      context: ./dgii_signature_microservice
      dockerfile: Dockerfile
    container_name: dgii-microservice-prod
    env_file:
      - ./dgii_signature_microservice/.env
    environment:
      ENV: "PROD"
    expose:
      - "9092"
    restart: always
    depends_on:
      - db-prod

  nginx-proxy:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./html:/usr/share/nginx/html
      - ./logs/nginx:/var/log/nginx
      - ./config/nginx/client-body-size.conf:/etc/nginx/conf.d/client-body-size.conf:ro
    restart: unless-stopped
    depends_on:
      - db-prod

  letsencrypt:
    image: jrcs/letsencrypt-nginx-proxy-companion
    container_name: nginx-letsencrypt
    environment:
      NGINX_PROXY_CONTAINER: nginx-proxy
      DEFAULT_EMAIL: novacagrodemi@gmail.com
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./certs:/etc/nginx/certs
      - ./html:/usr/share/nginx/html
      - ./acme:/etc/acme.sh
    depends_on:
      - nginx-proxy
    restart: unless-stopped

  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: fail2ban
    network_mode: "host"
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./fail2ban/data:/data
      - ./logs/nginx:/var/log/nginx:ro  # Leer logs planos
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: "America/Santo_Domingo"
    restart: unless-stopped
