default: &default
  adapter: postgresql
  encoding: unicode
  host: db-dev
  username: postgres
  password: password
  port: 5432
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# For details on connection pooling, see Rails configuration guide
# https://guides.rubyonrails.org/configuring.html#database-pooling

development:
  <<: *default
  database: <%= ENV['DATABASE_NAME'] %>_development

