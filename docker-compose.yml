version: "3.8"

services:
  db-dev:
    image: postgres:14
    volumes:
      - ./tmp/db-agrodemi-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password

  agrodemi-dev:
    build: .
    environment:
      DATABASE_NAME: "ADM"
      RAILS_ENV: "development"
    depends_on:
      - db-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/novac_server
    command: >
      sh -c "rm tmp/pids/server.pid ||
      rails server -b 0.0.0.0 --port 3000"