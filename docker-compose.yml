version: "3.8"

services:
  db-dev:
    image: postgres:13.7
    volumes:
      - ./tmp/db-demo-data:/var/lib/postgresql/data
    container_name: db-dev
    environment:
      POSTGRES_PASSWORD: N0v@cgu@rd
      POSTGRES_USER: novacSystem
    ports:
      - 127.0.0.1:9731:5432

  demo-dev:
    build:
      context: .
      dockerfile: docker/services/server/Dockerfile
    container_name: demo-dev
    environment:
      ALMACEN: "DEMO"
      RAILS_ENV: "development"
      TULU: "N0v@cgu@rd"
      FRAGA: "novacSystem"
      MONTU: "1Wt7ND-m7yZidbgRyf_89fNeK71gyz7fn"
    depends_on:
      - db-dev
    volumes:
      - .:/usr/src/novac_server
    command: ["./wait-for-it.sh", "db-dev:5432", "--", "sh", "./run_server.sh"]

  nginx-proxy-dev:
    build: ./docker/services/nginx
    container_name: nginx-proxy-dev
    ports:
      - 9093:9093
    depends_on:
      - demo-dev
