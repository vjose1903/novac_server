services:
  db-dev:
    image: postgres:13.7
    volumes:
      - ./tmp/db-agrodemi-data:/var/lib/postgresql/data
    container_name: db-dev
    environment:
      POSTGRES_PASSWORD: N0v@cgu@rd
      POSTGRES_USER: novacSystem
    ports:
      - 127.0.0.1:9731:5432

  agrodemi-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: agrodemi-dev
    environment:
      ALMACEN: "ADM"
      RAILS_ENV: "development"
      TULU: "N0v@cgu@rd"
      FRAGA: "novacSystem"
      MONTU: "1RzMbNCVAhqkNzH0mTO8f27-kfq1oum6a"
      VIRTUAL_HOST: "localhost"
    expose:
      - "3000"
    depends_on:
      - db-dev
    volumes:
      - .:/usr/src/novac_server
    command: ["./wait-for-it.sh", "db-dev:5432", "--", "sh", "./run_server.sh"]

  nginx-proxy-dev:
    image: jwilder/nginx-proxy
    container_name: nginx-proxy-dev
    ports:
      - 9090:80
    depends_on:
      - agrodemi-dev
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

