version: "3.8"

services:
  db:
    image: postgres:14
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password

  brendy:
    build: .
    environment:
      DATABASE_NAME: "panaderia_brendy"
      RAILS_ENV: "development"
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/novac_server
    command: >
      sh -c "rm tmp/pids/server.pid ||
      rails server -b 0.0.0.0 --port 3000"

volumes:
  db-data: