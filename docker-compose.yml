version: "3.8"

services:
  db:
    image: postgres:14
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password
    restart: always

  brendy:
    build: .
    environment:
      PRUEBA: "probando"
      DATABASE_NAME: "panaderia_brendy"
    depends_on:
      - db
    ports:
      - "3000:3000"
    volumes:
      - .:/usr/src/novac_server
    restart: always

volumes:
  db_data: