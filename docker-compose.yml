version: "3.8"

services:
  db-dev:
    image: postgres:13.7
    volumes:
      - ./tmp/db-vasquez-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      POSTGRES_PASSWORD: password

  vasquez-dev:
    build: .
    environment:
      DATABASE_NAME: "vasquez_services"
      RAILS_ENV: "development"
    depends_on:
      - db-dev
    ports:
      - "3002:3002"
    volumes:
      - .:/usr/src/novac_server
    command: ["./wait-for-it.sh", "db-dev:5432", "--", "sh", "./run_server.sh"]
